{% extends "layout.html" %}
{% block content %}

<div class="page-header">
  <h1>Add Transaction</h1>
</div>

<div class="form-card">
  <form method="POST" action="/add">
    <div class="form-group">
      <label>Type</label>
      <div class="toggle-group">
        <label class="toggle-option">
          <input type="radio" name="type" value="income" checked>
          <span>Income</span>
        </label>
        <label class="toggle-option">
          <input type="radio" name="type" value="expense">
          <span>Expense</span>
        </label>
      </div>
    </div>

    <div class="form-group">
      <label for="category">Category</label>
      <select id="category" name="category" required>
        <optgroup label="Income">
          {% for cat in categories.income %}
          <option value="{{ cat }}">{{ cat }}</option>
          {% endfor %}
        </optgroup>
        <optgroup label="Expenses">
          {% for cat in categories.expense %}
          <option value="{{ cat }}">{{ cat }}</option>
          {% endfor %}
        </optgroup>
      </select>
    </div>

    <div class="form-group">
      <label for="amount">Amount (R)</label>
      <input type="number" id="amount" name="amount" step="0.01" min="0.01" placeholder="0.00" required>
    </div>

    <div class="form-group">
      <label for="note">Note <span class="optional">(optional)</span></label>
      <input type="text" id="note" name="note" placeholder="e.g. Groceries at Shoprite">
    </div>

    <div class="form-group">
      <label for="date">Date</label>
      <input type="date" id="date" name="date">
    </div>

    <button type="submit" class="btn-primary">Save Transaction</button>
  </form>
</div>

{% endblock %}
